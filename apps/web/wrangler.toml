name = "momkiddis-web"
main = "dist/server/index.js"
compatibility_date = "2026-03-10"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

no_bundle = true

[assets]
directory = "dist/client"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "auto-trailing-slash"
# `true` sends EVERY request (including /assets/*.js, /assets/*.css, and
# public/ images) through the Worker's SSR router first, which has no route
# for them and 404s — that's what caused the unstyled "white page" bug.
# List the paths that genuinely need the Worker (everything, since this is a
# full SSR app) and negate the ones that must stay pure static files. Add a
# new "!/..." entry here whenever a new top-level file/folder is added to
# apps/web/public/.
run_worker_first = ["/*", "!/assets/*", "!/gallery-foto/*", "!/program/*", "!/robots.txt", "!/circle-logo.png", "!/Lita.png", "!/logo-with-text.png"]

# Non-sensitive vars — ganti dengan URL production setelah deploy pertama
[vars]
CORS_ORIGIN = "https://momkiddis.com"
BETTER_AUTH_URL = "https://momkiddis.com"

# NVIDIA_API_KEY dan BETTER_AUTH_SECRET sudah di-set sebagai Worker Secrets

[[d1_databases]]
binding = "DB"
database_id = "01c08ce4-8621-446f-95db-19d2ee439df0"
database_name = "momkiddis-db"
migrations_dir = "../../packages/db/src/migrations"
